<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Nền Gradient Hiện Đại -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Họa tiết trừu tượng công nghệ số -->
  <circle cx="150" cy="100" r="280" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="1050" cy="530" r="320" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="950" cy="120" r="180" fill="#f59e0b" fill-opacity="0.08" />

  <!-- Khung nội dung kính mờ Glassmorphism -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" filter="url(#shadow)" />

  <!-- Huy hiệu Bảng tin & AI -->
  <g transform="translate(130, 125)">
    <rect x="0" y="0" width="230" height="42" rx="21" fill="#f59e0b" fill-opacity="0.9" />
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">
      📰 BẢN TIN TUẦN HỌC ĐƯỜNG
    </text>

    <rect x="245" y="0" width="220" height="42" rx="21" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="268" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
      ✨ Hỗ trợ bởi AI (Gemini)
    </text>
  </g>

  <!-- Tiêu đề lớn -->
  <text x="130" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff">
    NGÂN HÀNG THỜI GIAN HỌC ĐƯỜNG
  </text>
  <text x="130" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#fed7aa">
    Lan tỏa tri thức • Tôn vinh gia sư • Kết nối tình bạn
  </text>

  <!-- Khối 3 con số minh họa -->
  <g transform="translate(130, 360)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="270" height="120" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="24" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#e0e7ff">Phiên học hoàn thành</text>
    <text x="24" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="bold" fill="#ffffff">100% Đồng đẳng</text>

    <!-- Box 2 -->
    <rect x="300" y="0" width="270" height="120" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="324" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#e0e7ff">Tín dụng thời gian</text>
    <text x="324" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="bold" fill="#34d399">1h dạy = 1h học</text>

    <!-- Box 3 -->
    <rect x="600" y="0" width="310" height="120" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="624" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#e0e7ff">Triết lý sư phạm</text>
    <text x="624" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="bold" fill="#fbbf24">Bình đẳng tri thức</text>
  </g>
</svg>
