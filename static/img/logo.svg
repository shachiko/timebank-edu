<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#grad1)" stroke="#ffffff" stroke-width="6"/>
  <!-- Clock Outer Ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6,4"/>
  <!-- Open Book at base -->
  <path d="M50,135 Q75,120 100,135 Q125,120 150,135 L146,145 Q125,132 100,145 Q75,132 54,145 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Clock Hands forming Time Exchange -->
  <circle cx="100" cy="92" r="6" fill="#f59e0b"/>
  <!-- Hour hand -->
  <line x1="100" y1="92" x2="80" y2="82" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="100" y1="92" x2="118" y2="60" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Graduation Cap (Education) -->
  <polygon points="100,42 62,56 100,70 138,56" fill="url(#goldGrad)"/>
  <rect x="94" y="66" width="12" height="10" fill="#d97706" rx="2"/>
  <path d="M125,60 L134,80" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <circle cx="134" cy="82" r="3" fill="#d97706"/>
  <!-- Sparkles / AI Star -->
  <path d="M142,42 L145,34 L148,42 L156,45 L148,48 L145,56 L142,48 L134,45 Z" fill="#fbbf24"/>
</svg>
