{% extends "base.html" %}

{% block title %}{{ _('Đặt lại mật khẩu - School Time Bank') }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #1B2A6B 0%, #2563EB 100%);">
          <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-3">
            <i class="bi bi-shield-lock-fill fs-2"></i>
          </div>
          <h4 class="fw-bold mb-1">{{ _('Thiết lập Mật khẩu Mới') }}</h4>
          <p class="small text-white-50 mb-0">{{ _('Tài khoản:') }}<strong>{{ user.ho_ten }}</strong> (<code>{{ user.ma_hoc_sinh }}</code>)</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
          <form action="{{ url_for('reset_password', token=token) }}" method="POST">
            <div class="mb-3">
              <label for="mat_khau_moi" class="form-label small fw-bold">{{ _('Mật khẩu mới') }}<span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control border-start-0 ps-1 rounded-end-3" id="mat_khau_moi" name="mat_khau_moi" placeholder="{{ _('Tối thiểu 6 ký tự') }}" minlength="6" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label for="mat_khau_xac_nhan" class="form-label small fw-bold">{{ _('Xác nhận mật khẩu mới') }}<span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-check-circle-fill"></i></span>
                <input type="password" class="form-control border-start-0 ps-1 rounded-end-3" id="mat_khau_xac_nhan" name="mat_khau_xac_nhan" placeholder="{{ _('Nhập lại mật khẩu mới') }}" minlength="6" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">
              <i class="bi bi-check2-circle me-1"></i> {{ _('Lưu mật khẩu mới & Đăng nhập') }}
            </button>
          </form>

          <div class="text-center pt-2 border-top">
            <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">
              {{ _('Hủy bỏ và quay lại Đăng nhập') }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
